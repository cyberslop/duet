name: Dependency Review

# Block PRs that introduce a dependency with a known vulnerability, before it
# reaches main. Complements Dependabot (which alerts after the fact) and
# cargo-deny (which owns the license/advisory policy for the whole tree).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
